<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">A 股数据工具</title>
  <desc id="desc">深色行情终端风格的封面，包含 K 线与资金流示意，标题为 A 股数据工具，副标题为 Next.js + FastAPI + akshare。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g opacity=".16" stroke="#3b82f6">
    <path d="M0 120h1280M0 240h1280M0 360h1280M0 480h1280"/>
    <path d="M160 0v640M320 0v640M480 0v640M640 0v640M800 0v640M960 0v640M1120 0v640"/>
  </g>
  <g opacity=".9">
    <g fill="#ef4444">
      <rect x="820" y="250" width="12" height="90" rx="2"/><rect x="850" y="210" width="12" height="120" rx="2"/>
      <rect x="880" y="230" width="12" height="100" rx="2"/><rect x="910" y="170" width="12" height="150" rx="2"/>
      <rect x="940" y="190" width="12" height="130" rx="2"/><rect x="970" y="140" width="12" height="150" rx="2"/>
    </g>
    <g fill="#22c55e">
      <rect x="820" y="180" width="12" height="70" rx="2"/><rect x="850" y="150" width="12" height="60" rx="2"/>
      <rect x="880" y="160" width="12" height="70" rx="2"/><rect x="910" y="110" width="12" height="60" rx="2"/>
      <rect x="940" y="120" width="12" height="70" rx="2"/><rect x="970" y="80" width="12" height="60" rx="2"/>
    </g>
    <path d="M820 220 L850 185 L880 195 L910 150 L940 165 L970 110" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="82" y="154" fill="#60a5fa" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="18" letter-spacing="6">NEXT.JS · FASTAPI · AKSHARE</text>
  <text x="78" y="262" fill="url(#accent)" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="76" font-weight="700" letter-spacing="4">A 股数据工具</text>
  <text x="82" y="320" fill="#cbd5e1" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="28" letter-spacing="2">市场概览 · K 线 · 资金流向 · 龙虎榜 · 规则选股</text>
  <text x="82" y="372" fill="#7c8ba1" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="19" letter-spacing="1">浏览器 → Next.js API 代理 → FastAPI → AKShare 公开数据</text>
  <g font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="15">
    <rect x="82" y="420" width="126" height="38" rx="19" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6" stroke-opacity=".4"/>
    <text x="145" y="445" text-anchor="middle" fill="#93c5fd">Next.js 16</text>
    <rect x="220" y="420" width="132" height="38" rx="19" fill="#22c55e" fill-opacity=".1" stroke="#22c55e" stroke-opacity=".35"/>
    <text x="286" y="445" text-anchor="middle" fill="#86efac">FastAPI</text>
    <rect x="364" y="420" width="112" height="38" rx="19" fill="#f59e0b" fill-opacity=".1" stroke="#f59e0b" stroke-opacity=".35"/>
    <text x="420" y="445" text-anchor="middle" fill="#fcd34d">AKShare</text>
    <rect x="488" y="420" width="120" height="38" rx="19" fill="#a855f7" fill-opacity=".1" stroke="#a855f7" stroke-opacity=".35"/>
    <text x="548" y="445" text-anchor="middle" fill="#d8b4fe">TypeScript</text>
  </g>
  <text x="82" y="548" fill="#64748b" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="16">仅个人学习/产品原型 · 不构成投资建议 · 数据可能延迟或缺失</text>
</svg>
